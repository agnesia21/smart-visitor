<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Visitor</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .kiosk {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 26px 48px;

            background: linear-gradient(135deg, #1c2333, #171b2b);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;

            display: grid;
            place-items: center;

            border-radius: 14px;
            background: linear-gradient(135deg, #5c91df, #7669e7);

            color: white;
            font-size: 20px;
        }

        .brand h1 {
            color: white;
            font-size: 21px;
            letter-spacing: 0.5px;
        }

        .brand p {
            color: #97a4ba;
            font-size: 13px;
            margin-top: 2px;
        }

        .staff-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 18px;
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);

            color: white;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;

            transition: background 0.15s ease, transform 0.15s ease;
        }

        .staff-button:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
        }

        /* ===== WELCOME SECTION ===== */

        .welcome {
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 60px 24px;
            text-align: center;
        }

        .live-clock {
            font-size: 14px;
            font-weight: 600;
            color: #5c62e7;

            padding: 8px 18px;
            border-radius: 999px;
            background: #eef1fd;

            margin-bottom: 26px;
            letter-spacing: 0.3px;
        }

        .small-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #97a4ba;
            margin-bottom: 10px;
        }

        .welcome h2 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .description {
            color: #71849f;
            font-size: 15px;
            margin-bottom: 40px;
        }

        .action-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-card {
            display: flex;
            align-items: center;
            gap: 16px;

            width: 260px;
            padding: 22px;

            background: white;
            border: 1px solid #e5ebf3;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(20, 40, 70, 0.06);

            text-decoration: none;
            color: #172033;
            cursor: pointer;

            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .action-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 36px rgba(20, 40, 70, 0.1);
        }

        .action-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 12px;
            font-size: 20px;
            color: white;
        }

        .checkin .action-icon {
            background: linear-gradient(135deg, #5c91df, #7669e7);
        }

        .checkin:hover {
            border-color: #b9c6e8;
        }

        .checkout .action-icon {
            background: linear-gradient(135deg, #74808f, #45526b);
        }

        .checkout:hover {
            border-color: #cdd4e0;
        }

        .action-card h3 {
            font-size: 16px;
            letter-spacing: 0.4px;
            margin-bottom: 3px;
        }

        .action-card p {
            font-size: 13px;
            color: #71849f;
        }

        /* ===== FOOTER ===== */

        footer {
            display: flex;
            justify-content: space-between;

            padding: 20px 48px;

            font-size: 13px;
            color: #97a4ba;
        }

        @media (max-width: 560px) {

            .header {
                padding: 20px 24px;
            }

            footer {
                flex-direction: column;
                gap: 6px;
                text-align: center;
                padding: 20px 24px;
            }
        }

    </style>
</head>

<body>

    <main class="kiosk">

        <header class="header">
            <div class="brand">
                <div class="brand-icon">✦</div>

                <div>
                    <h1>SMART VISITOR</h1>
                    <p>Visitor Management System</p>
                </div>
            </div>

            <a href="/staff" class="staff-button">
                🛡️ Petugas
            </a>
        </header>


        <section class="welcome">

            <div class="live-clock" id="liveClock">--:--:--</div>

            <p class="small-title">WELCOME</p>

            <h2>Selamat Datang</h2>

            <p class="description">
                Silakan pilih kebutuhan Anda untuk melanjutkan.
            </p>


            <div class="action-container">

                <a href="{{ url_for('checkin') }}" class="action-card checkin">
                    <div class="action-icon">→</div>
                    <div>
                        <h3>CHECK-IN</h3>
                        <p>Mulai kunjungan</p>
                    </div>
                </a>

                <a href="{{ url_for('checkout_page') }}" class="action-card checkout">
                    <div class="action-icon">←</div>
                    <div>
                        <h3>CHECK-OUT</h3>
                        <p>Selesaikan kunjungan</p>
                    </div>
                </a>

            </div>

        </section>


        <footer>
            <span>Smart Visitor Management</span>
            <span>AI Assisted Visitor System</span>
        </footer>

    </main>

    <script>
        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('liveClock');
            const options = {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            };
            const dateStr = now.toLocaleDateString('id-ID', options);
            const timeStr = now.toLocaleTimeString('id-ID', { hour12: false });
            clockEl.textContent = `${dateStr} · ${timeStr}`;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
