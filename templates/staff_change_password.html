<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganti Password - Smart Visitor</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            max-width: 640px;
            margin: 60px auto;
            padding: 20px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 25px;

            color: #172033;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s ease, transform 0.15s ease;
        }

        .back:hover {
            color: #5c62e7;
            transform: translateX(-2px);
        }

        .card {
            background: white;
            border: 1px solid #e5ebf3;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(20, 40, 70, 0.06);
        }

        .card h1 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .card > p {
            color: #71849f;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #45526b;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #dce3ee;
            font-size: 15px;
            background: #fbfcfe;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .field input:focus {
            outline: none;
            border-color: #7669e7;
            box-shadow: 0 0 0 3px rgba(118, 105, 231, 0.12);
        }

        .hint {
            margin-top: 6px;
            font-size: 12px;
            color: #97a4ba;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #fdecec;
            color: #c0392b;
            border: 1px solid #f5c6c2;
        }

        .alert-success {
            background: #eafaf1;
            color: #1e8449;
            border: 1px solid #b7e6c7;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #e0e6f0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5c91df, #7669e7);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            filter: brightness(1.05);
            box-shadow: 0 6px 14px rgba(92, 98, 231, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #45526b;
        }

        .btn-secondary:hover {
            background: #f4f7fb;
            border-color: #c9d4e5;
        }

    </style>

</head>

<body>

<div class="container">

    <a href="{{ url_for('staff_profile') }}" class="back">
        ← Kembali ke Profil
    </a>

    <div class="card">

        <h1>Ganti Password</h1>
        <p>Masukkan password lama dan password baru kamu.</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <form method="POST">

            <div class="field">
                <label for="password_lama">Password Lama</label>
                <input type="password" id="password_lama" name="password_lama" required>
            </div>

            <div class="field">
                <label for="password_baru">Password Baru</label>
                <input type="password" id="password_baru" name="password_baru" required minlength="6">
                <div class="hint">Minimal 6 karakter.</div>
            </div>

            <div class="field">
                <label for="konfirmasi_password">Konfirmasi Password Baru</label>
                <input type="password" id="konfirmasi_password" name="konfirmasi_password" required minlength="6">
            </div>

            <div class="actions">
                <a href="{{ url_for('staff_profile') }}" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-primary">Simpan Password</button>
            </div>

        </form>

    </div>

</div>

</body>

</html>
