<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil Petugas - Smart Visitor</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 25px;

            color: #172033;
            text-decoration: none;

            font-weight: 600;
            transition: color 0.15s ease, transform 0.15s ease;
        }

        .back:hover {
            color: #5c62e7;
            transform: translateX(-2px);
        }

        .profile-card {
            background: white;
            border: 1px solid #e5ebf3;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(20, 40, 70, 0.06);
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;

            padding-bottom: 25px;
            border-bottom: 1px solid #e8edf4;
        }

        .profile-header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 78px;
            height: 78px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: linear-gradient(135deg, #5c91df, #7669e7);
            box-shadow: 0 0 0 4px #eef1fd, 0 8px 20px rgba(92, 98, 231, 0.25);

            color: white;
            font-size: 28px;
            font-weight: 800;
        }

        .profile-header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .profile-header p {
            color: #71849f;
            margin-bottom: 10px;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 5px 12px;
            border-radius: 999px;

            background: #eef1fd;
            color: #5c62e7;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .role-badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #5c62e7;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid #e0e6f0;

            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;

            transition: all 0.15s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5c91df, #7669e7);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            filter: brightness(1.05);
            box-shadow: 0 6px 14px rgba(92, 98, 231, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #45526b;
        }

        .btn-secondary:hover {
            background: #f4f7fb;
            border-color: #c9d4e5;
        }

        .profile-info {
            margin-top: 10px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 14px;

            padding: 18px 0;
            border-bottom: 1px solid #edf1f6;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-icon {
            width: 38px;
            height: 38px;
            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 10px;
            background: #eef1fd;

            font-size: 16px;
        }

        .info-label {
            font-size: 12px;
            color: #7b8da5;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="container">

    <a href="{{ url_for('staff') }}" class="back">
        ← Kembali ke Dashboard
    </a>

    <div class="profile-card">

        <div class="profile-header">

            <div class="profile-header-left">

                <div class="avatar">
                    {{ staff_nama[0]|upper if staff_nama else 'A' }}
                </div>

                <div>

                    <h1>
                        {{ staff_nama }}
                    </h1>

                    <p>
                        Petugas Smart Visitor
                    </p>

                    <span class="role-badge">
                        {{ staff_role|capitalize }}
                    </span>

                </div>

            </div>

            <div class="header-actions">
                <a href="{{ url_for('staff_profile_password') }}" class="btn btn-secondary">🔑 Ganti Password</a>
                <a href="{{ url_for('staff_profile_edit') }}" class="btn btn-primary">✎ Edit Profil</a>
            </div>

        </div>

        <div class="profile-info">

            <div class="info-item">
                <div class="info-icon">👤</div>
                <div>
                    <div class="info-label">NAMA LENGKAP</div>
                    <div class="info-value">{{ staff_nama }}</div>
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon">🆔</div>
                <div>
                    <div class="info-label">USERNAME</div>
                    <div class="info-value">{{ staff_username }}</div>
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon">🛡️</div>
                <div>
                    <div class="info-label">ROLE</div>
                    <div class="info-value">{{ staff_role|capitalize }}</div>
                </div>
            </div>

        </div>

    </div>

</div>

</body>

</html>
